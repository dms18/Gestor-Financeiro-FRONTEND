# nginx do site (SPA) e proxy da API. O tráfego chega pelo Caddy (HTTPS/HTTP), na rede interna do Docker.
server_tokens off;

# IP real do cliente: o Caddy (rede interna do Docker) repassa X-Forwarded-For. Só ele é confiável aqui.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Limites por IP nas rotas anônimas de autenticação (cada chamada faz bcrypt, que é caro).
# Valores folgados para uso legítimo, inclusive atrás de CGNAT de operadoras móveis.
limit_req_zone $binary_remote_addr zone=auth_login:10m    rate=20r/m;
limit_req_zone $binary_remote_addr zone=auth_cadastro:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=auth_senha:10m    rate=10r/m;
limit_req_status 429;

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

  location = /api/auth/login {
    limit_req zone=auth_login burst=10 nodelay;
    proxy_pass http://api:8080/auth/login;
  }

  location = /api/auth/register {
    limit_req zone=auth_cadastro burst=3 nodelay;
    proxy_pass http://api:8080/auth/register;
  }

  location ~ ^/api/auth/(esqueci-senha|redefinir-senha)$ {
    limit_req zone=auth_senha burst=5 nodelay;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://api:8080;
  }

  location /api/ {
    proxy_pass http://api:8080/;
  }

  # O nginx não conhece a extensão .webmanifest; sem isso o manifesto sairia como application/octet-stream.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
  }

  location / {
    # Cabeçalhos do site (a API manda os dela). Só barra enquadramento por outros sites e MIME sniffing;
    # uma CSP completa de scripts exige testar o app em navegador e fica como próximo passo.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    try_files $uri $uri/ /index.html;
  }
}
