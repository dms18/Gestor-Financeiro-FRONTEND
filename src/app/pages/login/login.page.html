<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Gestor Financeiro MEI</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="login-container">
    <div class="logo-section">
      <ion-icon name="wallet" size="large" color="primary" aria-hidden="true"></ion-icon>
      <h1>Gestor Financeiro</h1>
      <p>Gerencie suas finanças com facilidade</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="login()" novalidate>
      <ion-item>
        <ion-label position="stacked">E-mail</ion-label>
        <ion-input
          type="email"
          formControlName="email"
          inputmode="email"
          autocomplete="username"
          placeholder="seu@email.com"
        ></ion-input>
      </ion-item>
      <app-campo-erro [control]="loginForm.get('email')"></app-campo-erro>

      <ion-item>
        <ion-label position="stacked">Senha</ion-label>
        <ion-input
          [type]="mostrarSenha ? 'text' : 'password'"
          formControlName="senha"
          autocomplete="current-password"
        ></ion-input>
        <ion-button
          slot="end"
          fill="clear"
          class="btn-olho"
          type="button"
          (click)="mostrarSenha = !mostrarSenha"
          [attr.aria-label]="mostrarSenha ? 'Ocultar senha' : 'Mostrar senha'"
          [attr.aria-pressed]="mostrarSenha"
        >
          <ion-icon slot="icon-only" [name]="mostrarSenha ? 'eye-off-outline' : 'eye-outline'" aria-hidden="true"></ion-icon>
        </ion-button>
      </ion-item>
      <app-campo-erro [control]="loginForm.get('senha')"></app-campo-erro>

      <ion-button expand="block" color="primary" type="submit" class="btn-principal" [disabled]="loading">
        <ion-spinner *ngIf="loading" name="dots" aria-hidden="true"></ion-spinner>
        <span aria-live="polite">{{ loading ? 'Entrando...' : 'Entrar' }}</span>
      </ion-button>
    </form>

    <div class="register-link">
      <p>Não tem conta?</p>
      <ion-button
        fill="clear"
        color="primary"
        (click)="irParaCadastro()"
      >
        Criar conta
      </ion-button>
    </div>
  </div>
</ion-content>
