<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Registrar</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="container">
    <h1>Criar Conta</h1>

    <form [formGroup]="registerForm" (ngSubmit)="registrar()" novalidate>
      <ion-item>
        <ion-label position="stacked">Nome</ion-label>
        <ion-input
          formControlName="nome"
          type="text"
          autocomplete="name"
          placeholder="Seu nome completo"
        ></ion-input>
      </ion-item>
      <app-campo-erro [control]="registerForm.get('nome')"></app-campo-erro>

      <ion-item>
        <ion-label position="stacked">Email</ion-label>
        <ion-input
          formControlName="email"
          type="email"
          inputmode="email"
          autocomplete="email"
          placeholder="seu@email.com"
        ></ion-input>
      </ion-item>
      <app-campo-erro [control]="registerForm.get('email')"></app-campo-erro>

      <ion-item>
        <ion-label position="stacked">CPF (opcional)</ion-label>
        <ion-input
          formControlName="cpf"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          placeholder="000.000.000-00"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">CNPJ (opcional)</ion-label>
        <ion-input
          formControlName="cnpj"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          placeholder="00.000.000/0000-00"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Tipo de Perfil</ion-label>
        <ion-select formControlName="perfil" interface="alert" cancelText="Cancelar" okText="OK">
          <ion-select-option value="PF">Pessoa Física</ion-select-option>
          <ion-select-option value="PJ">Pessoa Jurídica</ion-select-option>
          <ion-select-option value="AMBOS">Ambos</ion-select-option>
        </ion-select>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Senha</ion-label>
        <ion-input
          formControlName="senha"
          [type]="mostrarSenha ? 'text' : 'password'"
          autocomplete="new-password"
          placeholder="Mínimo 6 caracteres"
        ></ion-input>
        <ion-button
          slot="end"
          fill="clear"
          class="btn-olho"
          type="button"
          (click)="mostrarSenha = !mostrarSenha"
          [attr.aria-label]="mostrarSenha ? 'Ocultar senhas' : 'Mostrar senhas'"
          [attr.aria-pressed]="mostrarSenha"
        >
          <ion-icon slot="icon-only" [name]="mostrarSenha ? 'eye-off-outline' : 'eye-outline'" aria-hidden="true"></ion-icon>
        </ion-button>
      </ion-item>
      <app-campo-erro [control]="registerForm.get('senha')"></app-campo-erro>

      <ion-item>
        <ion-label position="stacked">Confirmar Senha</ion-label>
        <ion-input
          formControlName="confirmacaoSenha"
          [type]="mostrarSenha ? 'text' : 'password'"
          autocomplete="new-password"
          placeholder="Repita a senha"
        ></ion-input>
      </ion-item>
      <app-campo-erro [control]="registerForm.get('confirmacaoSenha')"></app-campo-erro>

      <div class="campo-erro-manual" role="alert" *ngIf="registerForm.get('confirmacaoSenha')?.value && registerForm.hasError('senhasNaoIguais')">
        <ion-icon name="alert-circle-outline" aria-hidden="true"></ion-icon>
        <span>As senhas não coincidem</span>
      </div>

      <ion-item lines="none" class="aceite-item">
        <ion-checkbox
          slot="start"
          formControlName="aceiteTermos"
          aria-label="Aceito os Termos de Uso e a Política de Privacidade"
        ></ion-checkbox>
        <ion-label class="ion-text-wrap aceite-label">
          Li e aceito os
          <a routerLink="/termos">Termos de Uso e a Política de Privacidade</a>.
        </ion-label>
      </ion-item>

      <ion-button
        expand="block"
        color="primary"
        type="submit"
        class="btn-principal"
      >
        Registrar
      </ion-button>
    </form>

    <div class="login-link">
      <p>
        Já tem conta?
        <ion-button fill="clear" (click)="irParaLogin()">
          Faça login
        </ion-button>
      </p>
    </div>
  </div>
</ion-content>
