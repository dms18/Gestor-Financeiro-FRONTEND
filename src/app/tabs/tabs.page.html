<ion-tabs>

  <ion-tab-bar slot="bottom">
    <ion-tab-button *ngFor="let aba of abas" [tab]="aba.tab" [layout]="(barraLateral$ | async) ? 'icon-start' : 'icon-top'">
      <ion-icon [name]="aba.icone"></ion-icon>
      <ion-label>{{ aba.rotulo }}</ion-label>
    </ion-tab-button>
  </ion-tab-bar>

</ion-tabs>
